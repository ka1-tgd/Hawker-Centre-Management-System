<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HawkerHub NEA Officer Login</title>
  <link rel="stylesheet" href="nea-officer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <a class="back" href="portal.html" aria-label="Back to portal">
    <span class="back-circle">
      <!-- Thick arrow SVG -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="#000000" stroke-width="3"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 5 5 12 12 19"/>
      </svg>
    </span>
  </a>

  <div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <h1>NEA Portal</h1>
      <p>Log in to conduct inspections and manage hygiene records for food stalls.</p>

      <!-- If you don't want account creation, you can remove this button -->
      <a href="nea_request_access.html">
        <button class="outline-btn">Request Access</button>
      </a>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

      <div class="form-box">
        <div class="logo">
          <img src="HawkerHub.png" alt="HawkerHub Logo">
          <div class="logo-text">HawkerHub</div>
        </div>

        <h2>NEA LOG IN</h2>

        <!-- Officer ID / Username -->
<div class="input-box">
  <i class="fa fa-id-badge"></i>
  <input id="loginId" type="text" placeholder="Officer ID / Username" required>
</div>

<!-- Password -->
<div class="input-box">
  <i class="fa fa-lock"></i>
  <input id="password" type="password" placeholder="Password" required>
</div>

<button id="btnLogin" class="primary-btn" type="button">Login</button>

<p id="msg" class="note"></p>


      </div>

    </div>

  </div>
  <script type="module" src="nea-login.js"></script>
</body>
</html>
