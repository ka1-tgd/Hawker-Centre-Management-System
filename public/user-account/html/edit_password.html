<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Change Password</title>

        <!--Shared Styles-->
        <link rel="stylesheet" href="../css/main.css">
    </head>

    <body>
        <!--Header-->
        <header class="header-box">
            <h2 class="header-title">Change Password</h2>
        </header>

        <!--Main Content-->
        <main class="main-content">
            <form class="enter-info" id="edit-password-form">

                <div class="enter-info-row">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                </div>

                <div class="enter-info-row">
                    <label for="password">Confirm Password:</label>
                    <input type="password" id="confirm-password" required>
                </div>

                <div class="edit-actions">
                    <button type="submit" class="button">Confirm</button>
                    <a class="back-button" href="account.html">Back</a>
                </div>
            </form>
        </main>

        <!--Link to script-->
        <script type="module" src="../scripts/register.js"></script>
    </body>
</html>
