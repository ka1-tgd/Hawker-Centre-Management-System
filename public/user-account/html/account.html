<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Account</title>

        <!--Shared Styles-->
        <link rel="stylesheet" href="../css/main.css">
    </head>

    <body>
        <!--Header-->
        <header class="header-box">
            <h2 class="header-title">Account Details</h2>
        </header>

        <!--Main Content-->
        <main class="main-content">

            <div class="acc-info-row">
                <span class="label">Name:</span>
                <span class="value" id="userName">-</span>
            </div>

            <div class="acc-info-row">
                <span class="label">Email:</span>
                <span class="value" id="userEmail">-</span>
            </div>

            <div class="acc-info-row">
                <span class="label">Contact Number:</span>
                <span class="value" id="userContact">-</span>
            </div>

            <div class="acc-info-row">
                <span class="label">Membership:</span>
                <span class="value" id="userRole">-</span>
            </div>

            <div class="user-actions">
                <button class="button" id="editButton">Edit Details</button>
                <button class="button" id="logOutButton">Log Out</button>
                <button class="button" id="changePasswordButton">Change Password</button>
                <button class="button" id="deleteButton">Delete Account</button>
                <button class="back-button" id="backButton">Back</button>
            </div>
        </main>

        <!--Link to script-->
        <script type="module" src="../scripts/account.js"></script>
    </body>
</html>
