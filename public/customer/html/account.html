<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Account - HawkerHub</title>
  <link rel="stylesheet" href="../css/customerEngagement.css">
</head>
<body>

<div class="navbar">
  <h1>HawkerHub</h1>
</div>

<div class="page">

  <div class="sidebar">
    <h2>My Account</h2>
    <a href="HCs-and-stalls.html">Home</a>
    <a href="account.html" class="active">My Details</a>
    <a href="my-orders.html">My Orders</a>
    <a href="cart.html">My Cart</a>
    <a href="likes.html">My Likes</a>
    <a href="feedback.html">Feedback</a>
    <a href="complaint.html">Complaints</a>
  </div>

  <div class="content">

    <h2 id="userName">Loading...</h2>
    <div class="profile-meta">
      <p id="userEmail"></p>
    </div>
    <a class="details-btn" href="../../user-account/html/account.html">More Details</a>

    <hr>

    <h3>Loyalty Points</h3>
    <div class="loyalty-header">
      <div class="points-value" id="pointsValue">0</div>
      <p id="tierLabel"></p>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>

    <h3>Rewards <small>Use your points</small></h3>
    <div class="reward-list-container">
      <div class="reward-grid" id="rewardGrid">Loading rewards...</div>
    </div>

    <h3>My Redemptions <small>Show this to the stall to claim</small></h3>
    <div id="redemptionList">Loading your redemptions...</div>

    <div id="message"></div>

  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const userId = parseInt(localStorage.getItem("userId")) || parseInt(params.get("userId"));
</script>

<script src="../scripts/loyalty-script.js"></script>
</body>
</html>
