<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Submit Complaint - HawkerHub</title>
  <link rel="stylesheet" href="../css/customerEngagement.css">
</head>
<body>

<div class="navbar">
  <h1>HawkerHub</h1>
</div>

<div class="page">
  <div class="sidebar">
    <div class="my-account-div"><a class="my-account" href="../../user-account/html/account.html">My Account</a></div>
    <a href="HCs-and-stalls.html">Home</a>
    <a href="account.html">My Details</a>
    <a href="my-orders.html">My Orders</a>
    <a href="cart.html">My Cart</a>
    <a href="likes.html">My Likes</a>
    <a href="feedback.html">Feedback</a>
    <a href="complaint.html" class="active">Complaints</a>
  </div>

  <div class="content">

    <h2>Submit a Complaint</h2>

    <form id="complaintForm">
      <label for="orderSelect">Which order?</label>
      <select id="orderSelect" required>
        <option value="">Loading your orders...</option>
      </select>

      <label for="categorySelect">Category</label>
      <select id="categorySelect" required>
        <option value="Food Quality">Food Quality</option>
        <option value="Wrong Order">Wrong Order</option>
        <option value="Price">Price</option>
        <option value="Long Waiting Time">Long Waiting Time</option>
        <option value="Hygiene">Hygiene</option>
      </select>

      <label for="descriptionInput">Description</label>
      <textarea id="descriptionInput" rows="3" maxlength="500" placeholder="Tell us what went wrong..." required></textarea>

      <button type="submit">Submit Complaint</button>
    </form>

    <div id="message"></div>

    <hr>

    <h2>My Complaints</h2>
    <div id="complaintList">Loading your complaints...</div>

  </div>

</div>
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box">
    <div class="popup-icon" id="popupIcon">✅</div>
    <div class="popup-message" id="popupMessage"></div>
    <button class="popup-close-btn" onclick="closePopup()">OK</button>
  </div>
</div>
<script src="../scripts/complaint-script.js"></script>
</body>
</html>
