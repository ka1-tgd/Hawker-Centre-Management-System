<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Stall Management</title>

    <link rel="stylesheet" href="../css/vendor-stall.css">
</head>

<body>
    <header>
        <div class="logo">
            HawkerHub
        </div>
        <nav>
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#" class="active">Stalls</a></li>
                <li><a href="#">Menus</a></li>
                <li><a href="#">Menu Items</a></li>
            </ul>
        </nav>

    </header>
    <main class="container">
        <div class="page-header">
            <div>
                <h1>Stall Management</h1>
                <p>
                    Manage your stalls here.
                </p>
            </div>
            <button id="btnAddStall">
                + Add Stall
            </button>
        </div>
        <div class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="Search Stall Name">
        </div>
        <table id="stallTable">
            <thead>
                <tr>
                    <th>Stall ID</th>
                    <th>Stall Name</th>
                    <th>Hawker Centre</th>
                    <th>Description</th>
                    <th>Operating Hours</th>
                    <th>Contact Number</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="stallTableBody">
            </tbody>
        </table>
    </main>
    <div id="stallModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">
                    Add Stall
                </h2>
                <span id="closeModal">
                    &times;
                </span>
            </div>
            <form id="stallForm">
                <input
                    type="hidden"
                    id="stall_id">
                <div class="form-group">
                    <label>
                        Hawker Centre ID
                    </label>
                    <input
                        type="number"
                        id="hawker_centre_id"
                        required>
                </div>
                <div class="form-group">
                    <label>
                        Stall Name
                    </label>
                    <input
                        type="text"
                        id="stall_name"
                        maxlength="100"
                        required>

                </div>
                <div class="form-group">
                    <label>
                        Description
                    </label>
                    <textarea
                        id="description"
                        rows="4"
                        maxlength="255"
                        required></textarea>
                </div>
                <div class="form-group">
                    <label>
                        Operating Hours
                    </label>
                    <input
                        type="text"
                        id="operating_hours"
                        placeholder="e.g. 9AM - 9PM"
                        required>
                </div>
                <div class="form-group">
                    <label>
                        Contact Number
                    </label>
                    <input
                        type="text"
                        id="contact_number"
                        maxlength="8"
                        required>
                </div>
                <div class="form-group">
                    <label>
                        Status
                    </label>
                    <select id="status">
                        <option value="Open">
                            Open
                        </option>
                        <option value="Close">
                            Close
                        </option>
                    </select>
                </div>
                <div class="form-buttons">
                    <button
                        type="submit"
                        id="saveButton">

                        Save

                    </button>
                    <button
                        type="button"
                        id="cancelButton">

                        Cancel

                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="../css/vendor-stall.js"></script>
</body>

</html>
