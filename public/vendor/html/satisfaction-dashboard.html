<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Satisfaction - Vendor Dashboard</title>
    <link rel="stylesheet" href="../css/vendor-stall.css">
</head>

<body>
    <header>
        <div class="logo">
            HawkerHub
        </div>
        <nav>
            <ul>
                <li><a href="vendor-home.html">Home</a></li>
                <li><a href="vendor-stall.html">Stalls</a></li>
                <li><a href="vendor-menu.html">Menus</a></li>
                <li><a href="vendor-orders.html">Orders</a></li>
                <li><a href="vendor-sales.html">Sales</a></li>
                <li><a href="vendor-complaints.html">Complaints</a></li>
                <li><a href="claim-redemption.html">Rewards</a></li>
                <li><a class="active">Reviews</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="page-header">
            <div>
                <h1>Customer Satisfaction</h1>
                <p>
                    View ratings and feedback for your stall.
                </p>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:20px; margin-bottom: 35px;">
            <div style="background:white; border-radius:10px; padding:25px; text-align:center; box-shadow:0 3px 12px rgba(0,0,0,.08);">
                <h2 id="ratingSummary" style="color:#26a354; font-size:28px; margin-bottom:8px;">Loading...</h2>
                <p style="color:#666;" id="ratingSummarySubtext"></p>
            </div>
        </div>

        <div class="page-header">
            <h1 style="font-size:24px;">Rating Breakdown</h1>
        </div>
        <div style="background:white; border-radius:10px; padding:20px; box-shadow:0 3px 12px rgba(0,0,0,.08); margin-bottom:35px;">
            <canvas id="ratingBreakdownChart" height="120"></canvas>
        </div>

        <div class="page-header">
            <h1 style="font-size:24px;">Rating Trend (last 30 days)</h1>
        </div>
        <div style="background:white; border-radius:10px; padding:20px; box-shadow:0 3px 12px rgba(0,0,0,.08); margin-bottom:35px;">
            <canvas id="ratingTrendChart" height="120"></canvas>
        </div>

        <div class="page-header">
            <h1 style="font-size:24px;">Recent Feedback</h1>
        </div>
        <div id="recentFeedback" style="margin-bottom:15px;">Loading recent feedback...</div>
        <div style="display:flex; justify-content:center; align-items:center; gap:15px; margin-bottom:35px;">
            <button id="prevPageBtn">Previous</button>
            <span id="pageLabel">Page 1</span>
            <button id="nextPageBtn">Next</button>
        </div>

        <p id="message" style="margin-top:20px; font-weight:bold;"></p>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="../scripts/satisfaction-dashboard-script.js"></script>
</body>

</html>
