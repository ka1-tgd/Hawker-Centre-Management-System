<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stall History - NEA Inspection Portal</title>
<link rel="stylesheet" href="../css/nea-styles.css">
</head>
<body>

<div class="topbar">
  <div class="brand">NEA Inspection Portal</div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="new-inspection.html">New Inspection</a>
    <a href="stall-history.html" class="active">Stall History</a>
    <a href="../../user-account/html/account.html">Account</a>
  </nav>
</div>

<div class="page">
  <h1>Stall History</h1>
  <p class="subtitle">View past inspections and hygiene grade for a stall.</p>

  <div class="card">
    <label for="stallIdInput">Select Stall</label>
    <select id="stallIdInput" class="select" style="margin-top:10px;">
        <option value="">Loading stalls...</option>
    </select>
    <button id="loadHistoryBtn" class="btn btn-primary" style="margin-top:10px;">Load History</button>
</div>

  <div class="card">
    <h3>Current Grade</h3>
    <p id="currentGrade"></p>
  </div>

  <div id="editSection" class="card" style="display:none;">
    <h3>Edit Inspection</h3>
    <input type="hidden" id="editInspectionId">
    <div class="field">
      <label for="editScore">Score (0-100)</label>
      <input type="number" id="editScore" class="input" min="0" max="100">
    </div>
    <div class="field">
      <label for="editRemarks">Remarks</label>
      <textarea id="editRemarks"></textarea>
    </div>
    <button id="saveEditBtn" class="btn btn-primary">Save Changes</button>
    <button id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
  </div>

  <div class="card">
    <h3>Inspection Records</h3>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Score</th>
          <th>Grade</th>
          <th>Remarks</th>
          <th>Officer</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="historyTableBody">
        <!-- rows filled by JS -->
      </tbody>
    </table>
  </div>

</div>
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box">
    <div class="popup-icon" id="popupIcon">✅</div>
    <div class="popup-message" id="popupMessage"></div>
    <button class="popup-close-btn" onclick="closePopup()">OK</button>
  </div>
</div>
<script src="../scripts/nea-script.js"></script>
</body>
</html>
